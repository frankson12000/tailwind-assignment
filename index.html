<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="./css/output.css">

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css
">

    <title>Tailwind-Assignment</title>
</head>
<body>
  <header class="h-14 border-b border-white/10 sticky top-0 z-100 bg-dark-blue text-white/70">
    <nav class="h-full flex items-center justify-between px-8">
      <div class="flex gap-1.5 items-center">
        <span class="p-1 bg-light-blue rounded-lg text-xs">
          <i class="fa-solid fa-bolt"></i>
        </span>
        <div class="text-lg">Nexus</div>
      </div>
      <ul class="flex gap-8">
        <li>
          <a href="#home">Home</a>
        </li>
        <li>
          <a href="#services">Services</a>
        </li>
        <li>
          <a href="#about">About</a>
        </li>
        <li>
          <a href="#contact">Contact</a>
        </li>
      </ul> 
      <button class="px-4 py-1 bg-light-blue rounded-lg">Get Started</button>

      <div class="lg:hidden">
        <button>
          <i class="fa-solid fa-bars"></i>
        </button>
        <ul>
          <li>
            <a href="#home">Home</a>
            <a href="#services">Services</a>
            <a href="#about">About</a>
            <a href="#contact">Contact</a>
          </li>
        </ul> 
        <button>Get Started</button>
      </div>
    </nav>

  <main>
    <section class="w-full h-[calc(100vh-4.5rem)]">
      <div class="pt-20 pl-12 bg-dark-blue text-white/70">
        <div>
          <div class="flex gap-1 text-4xl font-semibold">
          <h1>Build Your</h1>
          <span class="text-light-blue/48">Digital</span>
          </div> 
          <div class="text-4xl font-semibold">Future</div>
          <p class="mt-4">Transform your bussiness with cutting-edge solutions that drive growth and innovation in the digital landscape.</p>
          <div>
            <button>Start Your Journey</button>
            <button>Learn More</button>
          </div>
        </div>
        <div>
          <img src="" alt="">
        </div>
      </div>
    </section>
